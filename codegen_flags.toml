# Codegen flags shared by the entrypoint and the six character DLL modules (cvhd_manifest.toml `includes`).
# Root keys: they must stay outside any table.
#
# skip_msr: no mfmsr/mtmsrd emulation. The SDK emulates the game's interrupt-disable sections (mtmsrd r13,1 ...
# mtmsrd rN,1) with ONE process-wide recursive mutex, and every mfmsr takes that mutex too (885 enter sites,
# 3,800 mfmsr sites in this game). Console 0.177 stage: 13,000 contended locks a second between the four game
# workers, a third of their samples in the waiter's sleep, 22 fps. On the 360 those sections only mask interrupts
# on their own hardware thread (no cross-core exclusion), the guest's real locks are lwarx/stwcx (compare-and-swap
# here) and the host delivers no asynchronous interrupts into guest code, so nothing is lost. sa2-nx, usf4-nx and
# UnleashedRecomp ship it.
skip_msr = true

# Register localisation, step 1 (the set sa2-nx's notes call "needs no per-function marks"; UnleashedRecomp and
# MarathonRecomp ship it): cr0-cr7, ctr, xer and the lwarx reservation become C++ locals instead of ctx fields, so
# the host compiler keeps them in registers and drops dead stores. All four are volatile across calls in the PPC
# ABI, so a function entered through a pointer, a second entry (sub_8277ECF0) or a longjmp sees nothing it could
# rely on anyway. Console 0.187 (prof run): the guest code is 220% of the three cores' 262% busy; this class of
# change is what scales it. Step 2 (non_volatile_as_local, non_argument_as_local) needs the read-before-write audit.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true

# Step 2: r14-r31, f14-f31, v14-v31 and v64-v127 as C++ locals (callee-saved by the ABI: a callee may read them only
# after it wrote them). The generator elides the __savegprlr/__restgprlr/__savefpr/__restfpr calls and hands the
# locals through ctx around calls to SEH funclets it finds in the exception tables (tools/nonvolatile_audit.py:
# the 33 GPR read-before-write cases of this game are such __finally funclets; the 128 vector cases are the two
# unnamed v64-v127 save/restore helpers sub_82893F28 / sub_82894270, harmless as no-ops).
non_volatile_as_local = true
